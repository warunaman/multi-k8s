apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      component: server
  template:
    metadata:
      labels:
        component: server
    spec:
      containers:
        - name: server
          image: warunaman/multi-server
          ports:
            - containerPort: 5000
          env:
            - name: REDIS_HOST
              value: "redis-cluster-ip-service"
            - name: REDIS_PORT
              value: "6379"
            - name: PGUSER
              value: "postgres"
            - name: PGHOST
              value: "postgres-cluster-ip-service"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: "postgres"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgpassword
                  key: PGPASSWORD
          resources:             # <-- ADDED: Resource Definition
            requests:
              cpu: "100m"        # Requesting 100 millicores (0.1 CPU core)
              memory: "256Mi"    # Requesting 256 Megabytes
            limits:
              cpu: "300m"        # Allowing up to 300 millicores
              memory: "512Mi"    # Allowing up to 512 Megabytes