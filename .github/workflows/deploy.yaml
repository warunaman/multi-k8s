name: Deploy MultiK8s
on:
  push:
    branches:
      - main

env:
  SHA: $(git rev-parse HEAD)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v3

      - name: Test
        run: |-
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -t warunaman/react-test -f ./client/Dockerfile.dev ./client
          docker run -e CI=true warunaman/react-test npm test    

      - name: Set Identity Provider
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "projects/1096173956670/locations/global/workloadIdentityPools/github/providers/my-repo"
    
      - name: Set Project
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: multi-k8s-new-480504

      - name: Auth
        run: |-
          gcloud --quiet auth configure-docker

      - name: Get Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: multi-k8s-new
          location: australia-southeast1
          project_id: multi-k8s-new-480504

      - name: Build
        run: |-
          docker build -t warunaman/multi-client:latest -t warunaman/multi-client:${{ env.SHA }} -f ./client/Dockerfile ./client
          docker build -t warunaman/multi-server:latest -t warunaman/multi-server:${{ env.SHA }} -f ./server/Dockerfile ./server
          docker build -t warunaman/multi-worker:latest -t warunaman/multi-worker:${{ env.SHA }} -f ./worker/Dockerfile ./worker

      - name: Push
        run: |-
          docker push warunaman/multi-client:latest
          docker push warunaman/multi-server:latest
          docker push warunaman/multi-worker:latest
 
          docker push warunaman/multi-client:${{ env.SHA }}
          docker push warunaman/multi-server:${{ env.SHA }}
          docker push warunaman/multi-worker:${{ env.SHA }}

      - name: Apply
        run: |-
          kubectl apply -f k8s
          kubectl set image deployments/server-deployment server=warunaman/multi-server:${{ env.SHA }}
          kubectl set image deployments/client-deployment client=warunaman/multi-client:${{ env.SHA }}
          kubectl set image deployments/worker-deployment worker=warunaman/multi-worker:${{ env.SHA }}
